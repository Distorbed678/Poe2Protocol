# Instance protocol opcodes for client 0.5.5e Hotfix 1 (u16, big-endian on the wire).
# Client incoming factory: 0x142170500 (switch on opcode - 0x0d); full opcode -> class
# table: dumps/0.5.5e.hotfix1/ghidra/instance_factory_s2c.json (local, git-ignored;
# regenerate with scripts/re/dump_factory.py). Game-session handler: 0x1421220f0.

[client]
Hello = 0x000f
# Not decoded yet (fixed sizes in [client_body_sizes]); seen after entering an area.
# Aim target (cursor): u8 local player, u8 mode, then by mode (variable length).
AimTarget = 0x0062
Unknown00bc = 0x00bc
Unknown013d = 0x013d
Unknown0221 = 0x0221
Unknown023d = 0x023d
Unknown02e8 = 0x02e8
Unknown0351 = 0x0351
Unknown0357 = 0x0357
TerrainHashes = 0x009a
# Frame report, about every 100 ms: u8 frames, u32 (HNC bits).
FrameReport = 0x001c
# Exit to character selection (no body).
ExitRequest = 0x0173
# Leaving the game ("Exit to log in screen", quitting): u8, u8. Follows ExitReport.
LeaveGame = 0x001b
# Statistics sent when leaving an instance: u8, u16 length, bytes.
ExitReport = 0x0355
# A typed chat line: u8, wstring text, u8.
ChatSend = 0x0016
# Not decoded yet (sizes from single-message batches, 2026-10-14).
Unknown00fe = 0x00fe
Unknown0200 = 0x0200
# Pause/resume request (escape menu in a solo game): u8, u8 paused.
PauseRequest = 0x01ff
# Join a chat channel (global/trade) after entering an area.
ChatJoinRequest = 0x014c
# WASD input (direction vector; zero = stop).
MoveDirection = 0x0063
# Skill use (click-to-move uses the Move skill) and release of its input.
UseSkill = 0x01a5
SkillReleased = 0x01ad
# Running skill's new target (relative cell / entity) while its input is held.
UpdateSkillTarget = 0x01a8
UpdateSkillTargetEntity = 0x01aa
# Sprint/dodge key down or up: u8 player, u8 held.
SprintInput = 0x02e6
# Held skill input ended: u8 player (sender 0x14210fec0). Sent when the dodge/sprint key or an
# attack button is released; answered by SkillInputEndAck. Replies to the skill messages above:
# UseSkill -> UseSkillAck, UpdateSkillTarget -> UpdateSkillTargetAck, UpdateSkillTargetEntity ->
# UpdateSkillTargetEntityAck, SkillInputEnd -> SkillInputEndAck, SkillReleased ->
# SkillReleasedAck (docs/protocol/movement.md).
SkillInputEnd = 0x01ac

# Party and trade requests (docs/protocol/entities.md#party-and-trade). The two name messages
# share a class with 0x00c7: u8 local player + wstring.
PartyInvite = 0x00b6
PartyInviteCancel = 0x00b7
# Answering a party invitation: u8 local player, u32 party id. Read from the callbacks of the
# invite popup (Ghidra, `0x140c9ef70` sends 0x00b8, `0x140c9eee0` -> `0x142110c30` sends 0x00b9),
# never seen on the wire (gate G-PARTY, docs/protocol/entities.md#party-and-trade-flows-wp-c3).
PartyAccept = 0x00b8
PartyDecline = 0x00b9
# Trade with the player behind an entity id: u8 local player, u32 entity.
TradeRequest = 0x00db
TradeCancel = 0x00d2

[server]
EnableEncryption = 0x0011
# A chat line (players, the server): sender (channel prefix + name), text, item links.
ChatMessage = 0x0018
PingReply = 0x001d
ChatJoined = 0x014d
AreaInfo = 0x001e
LocalPlayers = 0x0022
InitialState = 0x0023
PlayerEntity = 0x0024
AddInventory = 0x00df
ExitSession = 0x0174
# Simulation messages (second factory 0x142186c20): queued per frame, applied by 0x1421343c0.
SimulationTick = 0x02f4
# Turn an entity toward a cell or entity (the echo of the client's AimTarget).
SetAimTarget = 0x01dc
# A component's delta (u8 component index + the component's own delta format).
ComponentDelta = 0x02f9
SimulationFrameValue = 0x02f5
SetPause = 0x01fe
AddObject = 0x02f7
# Entity WASD movement (direction + grid position), handled by the Actor component.
MoveDirectionUpdate = 0x0064
# An entity starts an action (skill id, target), handled by the Actor component.
StartAction = 0x01c8
# Empty action event sent with every roll start (the client only decrements a counter).
ActionEvent = 0x01ca
# New target location of an entity's current action.
UpdateActionTarget = 0x01cb
# Positioned: facing angle + lock (the server turns the player toward the cursor with it).
SetOrientation = 0x01df
# An entity's sprint key state (dodge roll -> sprint).
SprintState = 0x02e7
# An entity's stats change (Stats component).
StatsUpdate = 0x01d3
# Stats of one of an actor's skills change.
SkillStatsUpdate = 0x01d8
# Player component acknowledgements of the client's skill messages (absolute target cells).
# The official server answers every UseSkill/UpdateSkillTarget/SkillInputEnd with these and never
# sends UpdateActionTarget (0x1cb) or SetOrientation (0x1df) for movement.
UseSkillAck = 0x01ae
UpdateSkillTargetAck = 0x01af
UpdateSkillTargetEntityAck = 0x01b0
SkillInputEndAck = 0x01b1
SkillReleasedAck = 0x01b2
# Buffs (the sprint adds three: rows 2758, 2737, 2853) and their removal.
BuffAdded = 0x01eb
BuffRemoved = 0x01ec

# Other players and entity lifetime (docs/protocol/entities.md). 0x01c5/0x01c6/0x01c7/0x02fa
# are simulation messages with only the 11-byte header: destroy, wake, sleep and remove an
# entity. A player that leaves gets 0x0271, then 0x01c5 + 0x01c7 (key 0) and 0x02fa
# (key 0xffffffff) in one frame.
DestroyEntity = 0x01c5
EntityWake = 0x01c6
EntitySleep = 0x01c7
RemoveObject = 0x02fa
PresenceChanged = 0x0271
# Party invitation security code of the local player (0 at every entry): u8 local, u32.
SetPartyInvitationCode = 0x00c4
# Social list, party and trade replies.
SocialEntry = 0x00c6
SocialRemove = 0x00c7
PartyUpdate = 0x00c8
PartyEnded = 0x00c9
TradeState = 0x00d9
TradeAck = 0x00da
TradeEvent = 0x00e0
NoticeMessage = 0x0019

# Body sizes of client messages the server does not decode yet, so batches can be split.
[client_body_sizes]
Unknown00bc = 3
Unknown013d = 1
Unknown0221 = 1
Unknown023d = 2
Unknown02e8 = 2
SkillInputEnd = 1
Unknown0351 = 1
Unknown0016 = 5
Unknown00fe = 2
Unknown0200 = 2
Unknown0357 = 1

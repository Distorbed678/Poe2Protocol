[workspace]
resolver = "3"
members = ["poe-net", "poe-proto"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
bytes = "1"
salsa20 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"

poe-net = { path = "poe-net", default-features = false }
poe-proto = { path = "poe-proto" }

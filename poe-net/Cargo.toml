[package]
name = "poe-net"
description = "Transport layer: byte codec, stream ciphers, hexdump and (feature `tokio`) TCP connections"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The buffered TCP `Connection` (needs tokio). The codec, ciphers and hexdump never do, so
# the client DLL can use them without an async runtime.
tokio = ["dep:tokio", "dep:bytes", "dep:tracing"]

[dependencies]
salsa20.workspace = true
sha2.workspace = true
thiserror.workspace = true
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

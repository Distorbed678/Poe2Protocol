# gitleaks configuration (audit finding D-01 of the main repository,
# docs/plans/public-release-audit.md).
title = "Poe2Protocol"

[extend]
useDefault = true

# The only allowlisted finding: `key_xor` in the HNC opcode table. It is the 64-byte XOR table the
# game client keeps for its anti-cheat side channel, kept on purpose as a documented
# reverse-engineering constant. It is not a credential. One rule, one file.
[[allowlists]]
description = "HNC key_xor table: RE constant from the 0.5.5e Hotfix 1 client, not a credential (D-01)"
targetRules = ["generic-api-key"]
paths = [
  '''^opcodes/0\.5\.5e/hnc\.toml$''',
]

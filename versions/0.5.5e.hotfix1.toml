# Game client 0.5.5e Hotfix 1 (Steam app "Path of Exile 2", 2026-10-28): a client-only rebuild of
# 0.5.5e ("Fixed a bug where minimap landscape geometry could fail to render correctly"; the servers
# were not restarted), and since 2026-10-29 the only supported build (0.5.5e was dropped). Same
# protocol, opcodes and deserializers as 0.5.5e; 16 of 154,537 functions changed, the rest moved by
# small deltas (dumps/0.5.5e.hotfix1/addr_map.tsv, scripts/re/addr_map.py). Game data: no table, .tgr, .dgr,
# .tdt, .tmd or .arm changed (texture headers, a few models and effects did).
#
# THE one place that defines a supported client build. It lives in Poe2Protocol
# (versions/<version>.toml, next to opcodes/<version>/). Read by the servers (Poe2Server:
# `[game] version` selects the file; opcode folder; client check at login), by `cargo xtask` of
# the hub (deploy paths, dump folder, `check-build`) and by the launcher (a byte-identical copy
# in its versions/ folder, kept by `cargo xtask versions` in the hub; `cargo xtask check-build`
# and the xtask tests fail when the copy is stale). Format and procedure for a new build:
# docs/guides/new-game-version.md of Poe2ModdingProject.
#
# Paths below ([protocol] opcodes, [client_hook] signatures) are relative to the root of the
# consumer's checkout (its working directory), which has this repository at modules/protocol
# and Poe2ClientHook at modules/client-hook: Poe2Server and the hub both do. Sections a
# consumer does not know are ignored by it (the launcher reads depots, [exe] and [verify]).
version = "0.5.5e.hotfix1"
# supported = tested end to end; experimental = signatures resolve, layouts unchecked;
# legacy = kept for old captures only.
status = "supported"
app_id = 2694490
# `Build Revision:` of Client.txt, a plain ASCII string in the exe's .rdata.
build_revision = "326410"

# Both depots go into ONE directory, in this order: the later depot overwrites the earlier one
# ("exe over content"). The launcher passes them to DepotDownloader in a single run, in file
# order, so the player enters a Steam Guard code once.
[[depots]]
id = 2694491
manifest = "4712263798014036045"
role = "content"

[[depots]]
id = 2694492
manifest = "4973272861086296374"
role = "windows exe"

# The executable. Every number was measured on the GameFiles copy of the 0.5.5e Hotfix 1 install
# (manifests from the Steam app manifest of that install), NOT on a depot download made by the
# launcher: the first real install must confirm them.
[exe]
name = "PathOfExileSteam.exe"
# SHA-256 of the exe as installed by Steam. Leave out or set to "TODO" if unknown: the check
# is then skipped and says so.
sha256 = "d46f4c27576122afc41a428eef96b3b4c75592a16827ed8c2204508ab06a455d"
# false: a mismatch is a warning (the value is unconfirmed against the depot). Set true once a
# real depot install has matched.
sha256_enforce = false
size = 78336856
# PE header fields: the build fingerprint the client DLL selects its signature table by.
pe_timestamp = 0x6ae12470
image_size = 0x04ca0000

# What "verified" means for an install (launcher: src-tauri/src/verify.rs). Sanity floors (the
# GameFiles copy has 64783 files, 150.8 GB, without logs and hook files) and files that must
# exist with exactly this size.
[verify]
min_files = 58000
min_bytes = 130000000000

[[verify.files]]
path = "PathOfExileSteam.exe"
size = 78336856

[[verify.files]]
path = "Bundles2/_.index.bin"
size = 115161316

[[verify.files]]
path = "steam_api64.dll"
size = 262944

[[verify.files]]
path = "fmod.dll"
size = 1913344

[[verify.files]]
path = "bink2w64.dll"
size = 466560

# Opcode tables (login.toml, instance.toml, hnc.toml, inventories.tsv, deserializers.tsv).
[protocol]
# The hotfix changed no opcode and no deserializer of 0.5.5e (check-build fingerprints).
opcodes = "modules/protocol/opcodes/0.5.5e.hotfix1"

# The client DLL's signature table and what `check-build` treats as required.
[client_hook]
signatures = "modules/client-hook/signatures/0.5.5e.hotfix1.toml"
# Features (of the signature table) the private server cannot do without: a missing or
# ambiguous entry of one of them makes `check-build` exit 2. Entries of the other (research)
# features only make it exit 1.
required_features = [
    "login_patch", "patcher_skip", "login_cache", "crypto_bypass", "side_channel", "packets",
    "position_sync", "dump_object_types", "area_export",
]

# What the server learns about the client. The client sends no version string; the 32-byte
# `client_hash` of 0x0003/0x0005 is a SHA-256 of the executable file (LoginClientHash_Get32,
# 0x1420e7700). Confirmed for this build in game on 2026-10-28: standalone token logins of the
# hotfix client with this value listed and hashes_confirmed = false logged no "cannot be checked"
# line, i.e. the client's hash is the exe's SHA-256. Other builds are refused
# ([security] allow_unknown_client = false) with BackendErrors `InvalidProtocolVersion`.
[client]
hashes = ["d46f4c27576122afc41a428eef96b3b4c75592a16827ed8c2204508ab06a455d"]
hashes_confirmed = true
# Strings `check-build` must find in the exe (ASCII or UTF-16LE): command-line options, file
# names and log lines that tools and the DLL depend on.
strings = [
    "--success-event", "--disable-client-switching", "gateway_list.txt", "Bundles2/gateway_list.txt",
    "LatestClient.txt", "Unable to deserialise packet", "HNC Protocol Violated",
    "Generating level", "Tile hash", "Doodad hash", "Build Revision",
]

# Game data checks of `check-build` (against Bundles2, through poe-data). Which tables and
# columns the server reads is poe_data::used.
[data]
# SHA-256 of third_party/dat-schema/schema-poe2.min.json (the community schema is a rolling
# download; a different file may describe other column widths).
schema_sha256 = "7ae47829279b06cbbebdde293643b442938b7490654cf05f1ad31b5a581360e3"

# Row counts as of this build (a difference is a warning: a data patch adds rows).
[data.row_counts]
Stats = 27281
ActionTypes = 963
Inventories = 121
BackendErrors = 715
BuffDefinitions = 3218

# Rows the server addresses by index. A different row is an error: the index is a key.
[[data.anchor]]
table = "Stats"
value = "actor_scale_+%"
row = 1913          # network key 1914 = row + 1

[[data.anchor]]
table = "ActionTypes"
value = "Move"
row = 532
column_index = 1    # the unnamed key column
int = 10505         # skill id 0x20002909 = 0x20000000 | key

[[data.anchor]]
table = "Inventories"
value = "MainInventory1"
row = 0

[[data.anchor]]
table = "BuffDefinitions"
value = "post_dodge_roll_sprint"
row = 2737

[[data.anchor]]
table = "BuffDefinitions"
value = "minimum_sprint_period"
row = 2758

[[data.anchor]]
table = "BuffDefinitions"
value = "sprint_heavy_stunnable"
row = 2853

[[data.anchor]]
table = "BackendErrors"
value = "InvalidProtocolVersion"
row = 7             # result code 8 = row + 1
